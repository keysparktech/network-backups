! Command: show running-config
! device: ar01-dthyd01 (vEOS-lab, EOS-4.28.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$Cvlz4Wb7c.3OhrmU$8eOPO8sx1fWhHLrI.ioi.ORqoEJyDAuCymr/5ICOdAdmupM0Hp54Wy5E2K.kyhBuDCoDyqgVm/l0zuvHb2y.I/
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model ribd
!
logging host 172.20.21.1
!
hostname ar01-dthyd01
ip name-server vrf default 172.20.21.100
!
snmp-server contact admin@enterprise.local
snmp-server location access-floor2
snmp-server community public ro
snmp-server host 172.20.21.1 version 2c public
snmp-server enable traps
!
spanning-tree mode mstp
!
management api http-commands
   protocol unix-socket
   no shutdown
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description to-dist2
   no switchport
   ip address 10.12.1.2/30
!
interface Management1
   ip address 172.20.21.20/24
!
event-handler FIX-SNMP
   trigger on-boot
   action bash sudo ip addr add 172.20.21.20/24 dev vmnicet1
!
ip routing
!
ip route 0.0.0.0/0 10.0.0.2
ip route 0.0.0.0/0 172.20.21.1
!
ntp server 172.20.21.100
!
router ospf 1
   router-id 5.5.5.4
   passive-interface Management1
   network 10.12.1.0/30 area 0.0.0.0
   max-lsa 12000
!
management ssh
   authentication mode password
!
end