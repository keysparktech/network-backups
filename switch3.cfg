! Command: show running-config
! device: switch3 (vEOS-lab, EOS-4.28.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$eVNlbXuMkwWXmrRQ$IG7Q2M/DxTpdmM644tMGk/7uVoXNLgRmtJSq3f1wBjyPbTRB8Lc3IN.h/OZjen2p.8hKapUYx8/Re/xDFb.x50
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model ribd
!
logging host 172.31.31.130
!
hostname switch3
!
snmp-server community public ro
snmp-server host 172.31.31.130 version 2c public
snmp-server enable traps
!
spanning-tree mode mstp
!
management api http-commands
   protocol unix-socket
   no shutdown
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description to-router
   no switchport
   ip address 10.2.1.2/30
!
interface Loopback0
   ip address 10.255.0.4/32
!
interface Management1
   ip address 172.20.20.14/24
   no lldp transmit
   no lldp receive
!
event-handler FIX-SNMP
   trigger on-boot
   action bash sudo ip addr add 172.20.20.14/24 dev vmnicet1
!
ip routing
!
ip route 0.0.0.0/0 10.0.0.2
ip route 0.0.0.0/0 172.20.20.1
!
router ospf 1
   router-id 10.255.0.4
   network 10.2.1.0/30 area 0.0.0.0
   network 10.255.0.4/32 area 0.0.0.0
   max-lsa 12000
!
management ssh
   authentication mode password
!
end