! Command: show running-config
! device: switch4 (vEOS-lab, EOS-4.28.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$2jHi4wNG8220HrUd$O1HkUzYA1phAjJ0mKQX6C3gX1qtB9eoyx5UC4N2Hg7DRHAWysDwsgypni5apRG0fxHOQ4aR5MNB8WsgCuV3R3/
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model ribd
!
logging host 172.31.31.130
!
hostname switch4
!
snmp-server community public ro
snmp-server host 172.31.31.130 version 2c public
snmp-server enable traps
!
spanning-tree mode mstp
!
management api http-commands
   protocol unix-socket
   no shutdown
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description to-router
   no switchport
   ip address 10.2.2.2/30
!
interface Loopback0
   ip address 10.255.0.5/32
!
interface Management1
   ip address 172.20.20.15/24
   no lldp transmit
   no lldp receive
!
event-handler FIX-SNMP
   trigger on-boot
   action bash sudo ip addr add 172.20.20.15/24 dev vmnicet1
!
ip routing
!
ip route 0.0.0.0/0 10.0.0.2
ip route 0.0.0.0/0 172.20.20.1
!
router ospf 1
   router-id 10.255.0.5
   network 10.2.2.0/30 area 0.0.0.0
   network 10.255.0.5/32 area 0.0.0.0
   max-lsa 12000
!
management ssh
   authentication mode password
!
end